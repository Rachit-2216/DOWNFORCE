[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "downforce-core"
version = "0.1.0"
description = "Provider-neutral historical race data and replay domain for DOWNFORCE"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<4.0",
  "pyarrow>=18,<30",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
ingestion = ["fastf1==3.8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/downforce_core"]
